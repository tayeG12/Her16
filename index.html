<style>

</style>
</head>

];

for(var i=0;i<90;i++){var s=document.createElement('div');s.className='s';var z=Math.random()*2.5+1;s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;--d:'+(2+Math.random()*4)+'s;animation-delay:'+Math.random()*4+'s';sky.appendChild(s)}
[[15,30,'✨'],[85,58,'✨'],[22,78,'✦'],[80,22,'✦']].forEach(function(a){var e=document.createElement('div');e.className='tw';e.textContent=a[2];e.style.cssText='left:'+a[0]+'%;top:'+a[1]+'%;font-size:22px';fx.appendChild(e)});

(function(){

 var bw=r.width,bh=r.height,nx,ny,t=0,box;

}
(function(){
 var sw=document.getElementById('sw'),sk=document.getElementById('sk'),drag=false,sx=0,max=0,d=0;
 sk.addEventListener('pointerdown',function(e){drag=true;sx=e.clientX;d=0;max=sw.clientWidth-sk.clientWidth-8;sk.setPointerCapture(e.pointerId);sk.style.transition='none'});
 sk.addEventListener('pointermove',function(e){if(!drag)return;d=Math.max(0,Math.min(max,e.clientX-sx));sk.style.transform='translateX('+d+'px)'});
 function end(){if(!drag)return;drag=false;sk.style.transition='transform .3s';if(d>max*.8){sk.style.transform='translateX('+max+'px)';setTimeout(openGallery,250)}else sk.style.transform='translateX(0)';d=0}
 sk.addEventListener('pointerup',end);sk.addEventListener('pointercancel',end);

})();
function wrap(str,st,step){return str.split(' ').map(function(w,n){return '<span class="w" style="animation-delay:'+(st+n*step).toFixed(2)+'s">'+w+'</span>'}).join(' ')}
function openCard(i){
 var th=themes[i],card=document.getElementById('card'),m=memories[i],k,e;
 card.style.setProperty('--c1',th.c);card.style.setProperty('--glow',th.g);
 var dc=document.getElementById('decor');dc.innerHTML='';
 for(k=0;k<24;k++){e=document.createElement('span');e.className='dc';e.textContent=th.s[k%th.s.length];e.style.cssText='left:'+Math.random()*92+'%;font-size:'+(18+Math.random()*26)+'px;--t:'+(5+Math.random()*5)+'s;--dl:-'+Math.random()*8+'s';dc.appendChild(e)}
 var gl=document.getElementById('garland');gl.innerHTML='';
 for(k=0;k<7;k++){e=document.createElement('span');e.textContent=th.s[k%th.s.length];e.style.cssText='left:'+(k*14.5+2)+'%;--dl:-'+k*.45+'s';gl.appendChild(e)}
 document.getElementById('hero').innerHTML='<div class="orbit">'+th.o.map(function(x,n){return '<span style="--a:'+(n*360/th.o.length)+'">'+x+'</span>'}).join('')+'</div><div class="he">'+th.h+'</div>';
 var tw=m.t.split(' ').length,pw=m.p.split(' ').length;
 document.getElementById('ct').innerHTML=wrap(m.t,.5,.25);
 document.getElementById('cp').innerHTML=wrap(m.p,.5+tw*.25+.3,.2);
 var cb=document.getElementById('cb'),last=i===memories.length-1;cb.style.display=last?'none':'';cb.textContent=last?'Close ♥':'Next star ✦';var dl=(.5+tw*.25+.3+pw*.2+.5).toFixed(2)+'s';cb.style.animationDelay=dl;var swe=document.getElementById('sw');swe.style.display=last?'block':'none';swe.style.animationDelay=dl;var skk=document.getElementById('sk');skk.style.transition='none';skk.style.transform='none';
 card.classList.add('show');
}
document.getElementById('cb').onclick=function(){document.getElementById('card').classList.remove('show');if(cur<memories.length){cur++;if(cur>=memories.length){document.getElementById('hint').textContent='Every star is yours ♥';document.getElementById('count').textContent='STARS · '+memories.length+' / '+memories.length}else document.getElementById('hint').textContent='Tap the next glowing star ✨'}refresh()};
refresh();
</script>
